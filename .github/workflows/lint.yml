name: Lint

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application
        uses: ./.github/actions/build_application
        with:
          python-version: "3.12"

      - name: Lint with flake8
        run: poetry run flake8 config db model runner.py

      - name: Run tests with coverage
        env:
          DB_FILE_NAME: ./db/emails.sqlite
          DB_URL: sqlite:///./db/emails.sqlite
          TABLE_NAME: spam_messages
          MODEL_PATH: ./artifacts/models
          MODEL_NAME: NB_db_v1.onnx
          VECTORIZER_PATH: ./artifacts/vectorizer
          VECTORIZER_NAME: vectorizer.joblib
          LOG_LEVEL: INFO
        run: poetry run pytest --cov

  run-pipeline:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application
        uses: ./.github/actions/build_application
        with:
          python-version: "3.12"

      - name: Create required directories
        run: mkdir -p logs artifacts/models artifacts/vectorizer

      - name: Run pipeline (train + inference)
        env:
          DB_FILE_NAME: ${{ vars.DB_FILE_NAME }}
          DB_URL: ${{ vars.DB_URL }}
          MODEL_PATH: ${{ vars.MODEL_PATH }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          VECTORIZER_PATH: ${{ vars.VECTORIZER_PATH }}
          VECTORIZER_NAME: ${{ vars.VECTORIZER_NAME }}
          TABLE_NAME: ${{ vars.TABLE_NAME }}
          LOG_LEVEL: INFO
        run: poetry run python3 runner.py
