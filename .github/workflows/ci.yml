name: Lint and Run Pipeline

on: push

jobs:
  lint-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.1.3"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-python-3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-python-3.12-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint with flake8
        run: poetry run flake8

      - name: Create required directories
        run: |
          mkdir -p logs
          mkdir -p artifacts/models
          mkdir -p artifacts/vectorizer

      - name: Run pipeline (train + inference)
        env:
          DATA_FILE_NAME: ${{ vars.DATA_FILE_NAME }}
          DB_FILE_NAME: ${{ vars.DB_FILE_NAME }}
          DB_URL: ${{ vars.DB_URL }}
          MODEL_PATH: ${{ vars.MODEL_PATH }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          VECTORIZER_PATH: ${{ vars.VECTORIZER_PATH }}
          VECTORIZER_NAME: ${{ vars.VECTORIZER_NAME }}
          TABLE_NAME: ${{ vars.TABLE_NAME }}
          LOG_LEVEL: INFO
        run: poetry run python runner.py
