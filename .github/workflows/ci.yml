name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  lint-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: Development/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('Development/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint with flake8
        working-directory: Development
        run: poetry run flake8

      - name: Create required directories
        working-directory: Development
        run: mkdir -p logs artifacts/models artifacts/vectorizer

      - name: Run pipeline (train + inference)
        working-directory: Development
        env:
          # populate required .env values as CI secrets/vars, not committed
          DATA_FILE_NAME: ${{ vars.DATA_FILE_NAME }}
          DB_FILE_NAME: ${{ vars.DB_FILE_NAME }}
          DB_URL: ${{ vars.DB_URL }}
          MODEL_PATH: ${{ vars.MODEL_PATH }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          VECTORIZER_PATH: ${{ vars.VECTORIZER_PATH }}
          VECTORIZER_NAME: ${{ vars.VECTORIZER_NAME }}
          TABLE_NAME: ${{ vars.TABLE_NAME }}
          LOG_LEVEL: INFO
        run: poetry run python3 runner.py
