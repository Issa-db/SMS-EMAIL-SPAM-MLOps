[project]
name = "spam-inference-microservices"
version = "0.1.0"
description = "Separated model building and Flask inference API"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask>=3.0,<4.0",
    "joblib>=1.3,<2.0",
    "loguru>=0.7,<0.8",
    "numpy>=1.26,<2.0",
    "onnxruntime>=1.18,<2.0",
    "pandas>=2.2,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "scikit-learn==1.3.2",
    "scipy>=1.11,<2.0",
    "skl2onnx>=1.16,<2.0",
    "sqlalchemy>=2.0,<3.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:capture --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=80"

[tool.coverage.run]
branch = true
omit = ["tests/*", "src/runner_*.py"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
