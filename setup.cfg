[flake8]
max-line-length = 79
exclude =
    ./config/.env
    ./db/emails.sqlite
    ./logs/*
    ./artifacts/*
    .git
    __pycache__
    .venv

per-file-ignores =
    ./config/*: F401
    ./config/__init__.py: WPS412, WPS410

ignore =
    WPS111,
    WPS115,
    #WPS226,
    WPS229,
    WPS210,
    WPS213,
    WPS300,
    WPS421,
    WPS459

; short names (X, y, e - standard ML/exception conventions)
; short try body length (single-purpose try/except is fine)
; too many local variables (ML pipelines need several)
; too many expressions
; local folder imports (intentional in __init__.py)
; print() (intentional CLI output in runner.py)
; comparison with float (accuracy threshold check)

max-line-complexity = 16
max-local-variables = 10
